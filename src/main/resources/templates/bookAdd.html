<!DOCTYPE html>

<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

    <head>
        <meta charset="UTF-8">
        <title>Add Book</title>
    </head>
    <body>
        <h1>Add a new book</h1>

        <!-- th:action adds the CSRF token automatically -->
        <form th:action="@{/books/add}" method="post">
            <div>
                <label for="title">Title:</label>
                <input type="text" id="title" name="title" required>
            </div>
            <div>
                <label for="author">Author:</label>
                <input type="text" id="author" name="author" required>
            </div>
            <div>
                <label for="price">Price:</label>
                <input type="number" id="price" name="price" step="0.01" min="0" required>
            </div>
            <div>
                <label for="copies">Copies:</label>
                <input type="number" id="copies" name="copies" min="0" required>
            </div>
            <button type="submit">Save</button>
            <!-- type="button" means it does not submit the form; it only sends the browser back to the book list -->
            <button type="button" th:onclick="|window.location.href='@{/books}'|">Cancel</button>
        </form>
    </body>
</html>
