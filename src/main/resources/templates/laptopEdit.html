<!DOCTYPE html>

<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

    <head>
        <meta charset="UTF-8">
        <title>Edit Laptop</title>
    </head>
    <body>

        <!-- Logged-in user area: username on the top right and the logout button -->
        <div style="float: right;">
            <span><strong sec:authentication="name">username</strong></span>
            <!-- Only visible for users with the ADMIN role -->
            <span sec:authorize="hasRole('ADMIN')">(admin)</span>
        </div>

        <h1>Edit laptop</h1>

        <!-- The id goes in the URL; th:value fills each field with the current data -->
        <form th:action="@{/laptops/edit/{id}(id=${laptop.id})}" method="post">
            <div>
                <label for="description">Model / description:</label>
                <input type="text" id="description" name="description" th:value="${laptop.description}" required>
            </div>
            <div>
                <label for="brand">Brand:</label>
                <input type="text" id="brand" name="brand" th:value="${laptop.brand}" required>
            </div>
            <div>
                <label for="processor">Processor:</label>
                <input type="text" id="processor" name="processor" th:value="${laptop.processor}" required>
            </div>
            <div>
                <label for="ramGb">RAM (GB):</label>
                <input type="number" id="ramGb" name="ramGb" min="1" th:value="${laptop.ramGb}" required>
            </div>
            <div>
                <label for="storageGb">Storage (GB):</label>
                <input type="number" id="storageGb" name="storageGb" min="1" th:value="${laptop.storageGb}" required>
            </div>
            <div>
                <label for="price">Price:</label>
                <input type="number" id="price" name="price" step="0.01" min="0" th:value="${laptop.price}" required>
            </div>
            <div>
                <label for="copies">Copies:</label>
                <input type="number" id="copies" name="copies" min="0" th:value="${laptop.copies}" required>
            </div>
            <button type="submit">Update</button>
            <button type="button" th:onclick="|window.location.href='@{/laptops}'|">Cancel</button>
        </form>
    </body>
</html>
