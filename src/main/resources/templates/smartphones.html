<!DOCTYPE html>

<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

    <head>
        <meta charset="UTF-8">
        <!-- Page title displayed in the browser tab -->
        <title>Available Smartphones</title>
    </head>
    <body>

        <!-- Logged-in user area: username on the top right and the logout button -->
        <div style="float: right;">
            <span><strong sec:authentication="name">username</strong></span>
            <!-- Only visible for users with the ADMIN role -->
            <span sec:authorize="hasRole('ADMIN')">(admin)</span>
            <!-- Logout has to be a POST form; th:action adds the CSRF token automatically -->
            <form th:action="@{/logout}" method="post" style="display: inline;">
                <button type="submit">Logout</button>
            </form>
        </div>

        <!-- Top Navigation Bar: buttons that only send the browser to another page -->
        <nav>
            <button type="button" th:onclick="|window.location.href='@{/books}'|">Books</button>
            <button type="button" th:onclick="|window.location.href='@{/laptops}'|">Laptops</button>
            <button type="button" th:onclick="|window.location.href='@{/smartphones}'|">Smartphones</button>
            <button type="button" th:onclick="|window.location.href='@{/cart}'|">View Shopping Cart</button>
        </nav>

        <h1>Available Smartphones</h1>

        <!-- Message sent by the controller when a smartphone cannot be deleted -->
        <p th:if="${error}" th:text="${error}" style="color: red;"></p>

        <!-- Only admins see this button -->
        <p sec:authorize="hasRole('ADMIN')">
            <button type="button" th:onclick="|window.location.href='@{/smartphones/add}'|">Add new smartphone</button>
        </p>

        <!-- Smartphones Table (rendered only if smartphones list is not empty) -->
        <table border="1" th:if="${smartphones != null and not #lists.isEmpty(smartphones)}">
            <thead>
            <tr>
                <th>ID</th>
                <th>Brand / Model</th>
                <th>Price</th>
                <th>Copies</th>
                <th>Action</th>
            </tr>
            </thead>
            <tbody>
            <!-- Iterate over the smartphones collection provided by the Controller -->
            <!-- 'th:if="${phone != null}"' prevents errors if a null element exists in the list -->
            <tr th:each="phone : ${smartphones}" th:if="${phone != null}">
                <td th:text="${phone.id}"></td>
                <td th:text="${phone.description}"></td>
                <td th:text="${phone.price}"></td>
                <!-- Stock left, so the drop after a checkout is visible -->
                <td th:text="${phone.copies}"></td>
                <td>
                    <form th:action="@{/cart/add}" method="post" style="display: inline;">
                        <input type="hidden" name="productId" th:value="${phone.id}" />
                        <button type="submit" class="btn btn-primary">Add to Cart</button>
                    </form>

                    <!-- Edit and Delete are only visible for admins -->
                    <span sec:authorize="hasRole('ADMIN')">

                        <!-- A GET form with a button, so Edit looks the same as the other buttons -->
                        <form th:action="@{/smartphones/edit/{id}(id=${phone.id})}" method="get" style="display: inline;">
                            <button type="submit">Edit</button>
                        </form>

                        <!-- Delete must be a POST form, never a plain link -->
                        <form th:action="@{/smartphones/delete/{id}(id=${phone.id})}" method="post" style="display: inline;"
                              onsubmit="return confirm('Delete this smartphone?');">
                            <button type="submit">Delete</button>
                        </form>
                    </span>
                </td>
            </tr>
            </tbody>
        </table>

        <!-- Fallback message displayed if no smartphones are available -->
        <div th:if="${smartphones == null or #lists.isEmpty(smartphones)}">
            <p>No smartphones available at the moment.</p>
        </div>

    </body>
</html>
