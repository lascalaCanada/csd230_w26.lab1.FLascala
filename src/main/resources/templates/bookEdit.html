<!DOCTYPE html>

<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

    <head>
        <meta charset="UTF-8">
        <title>Edit Book</title>
    </head>
    <body>

        <!-- Logged-in user area: username on the top right and the logout button -->
        <div style="float: right;">
            <span><strong sec:authentication="name">username</strong></span>
            <!-- Only visible for users with the ADMIN role -->
            <span sec:authorize="hasRole('ADMIN')">(admin)</span>
        </div>

        <h1>Edit book</h1>

        <!-- The id goes in the URL; th:value fills each field with the current data of the book -->
        <form th:action="@{/books/edit/{id}(id=${book.id})}" method="post">
            <div>
                <label for="title">Title:</label>
                <input type="text" id="title" name="title" th:value="${book.title}" required>
            </div>
            <div>
                <label for="author">Author:</label>
                <input type="text" id="author" name="author" th:value="${book.author}" required>
            </div>
            <div>
                <label for="price">Price:</label>
                <input type="number" id="price" name="price" step="0.01" min="0" th:value="${book.price}" required>
            </div>
            <div>
                <label for="copies">Copies:</label>
                <input type="number" id="copies" name="copies" min="0" th:value="${book.copies}" required>
            </div>
            <button type="submit">Update</button>
            <!-- type="button" means it does not submit the form; it only sends the browser back to the book list -->
            <button type="button" th:onclick="|window.location.href='@{/books}'|">Cancel</button>
        </form>
    </body>
</html>
