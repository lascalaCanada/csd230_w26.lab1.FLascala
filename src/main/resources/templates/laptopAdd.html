<!DOCTYPE html>

<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

    <head>
        <meta charset="UTF-8">
        <title>Add Laptop</title>
    </head>
    <body>
        <h1>Add a new laptop</h1>

        <!-- th:action adds the CSRF token automatically -->
        <form th:action="@{/laptops/add}" method="post">
            <div>
                <label for="description">Model / description:</label>
                <input type="text" id="description" name="description" required>
            </div>
            <div>
                <label for="brand">Brand:</label>
                <input type="text" id="brand" name="brand" required>
            </div>
            <div>
                <label for="processor">Processor:</label>
                <input type="text" id="processor" name="processor" required>
            </div>
            <div>
                <label for="ramGb">RAM (GB):</label>
                <input type="number" id="ramGb" name="ramGb" min="1" required>
            </div>
            <div>
                <label for="storageGb">Storage (GB):</label>
                <input type="number" id="storageGb" name="storageGb" min="1" required>
            </div>
            <div>
                <label for="price">Price:</label>
                <input type="number" id="price" name="price" step="0.01" min="0" required>
            </div>
            <div>
                <label for="copies">Copies:</label>
                <input type="number" id="copies" name="copies" min="0" required>
            </div>
            <button type="submit">Save</button>
            <!-- type="button" means it does not submit the form; it only goes back to the list -->
            <button type="button" th:onclick="|window.location.href='@{/laptops}'|">Cancel</button>
        </form>
    </body>
</html>
