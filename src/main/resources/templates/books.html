<!DOCTYPE html>

<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

    <head>
        <meta charset="UTF-8">
        <!-- Page title displayed in the browser tab -->
        <title>Available Books</title>
    </head>
    <body>

        <!-- Logged-in user area: username on the top right and the logout button -->
        <div style="float: right;">
            <span><strong sec:authentication="name">username</strong></span>
            <!-- Only visible for users with the ADMIN role -->
            <span sec:authorize="hasRole('ADMIN')">(admin)</span>
            <!-- Logout has to be a POST form; th:action adds the CSRF token automatically -->
            <form th:action="@{/logout}" method="post" style="display: inline;">
                <button type="submit">Logout</button>
            </form>
        </div>

        <!-- Top Navigation Bar: buttons that only send the browser to another page -->
        <nav>
            <button type="button" th:onclick="|window.location.href='@{/books}'|">Books</button>
            <button type="button" th:onclick="|window.location.href='@{/laptops}'|">Laptops</button>
            <button type="button" th:onclick="|window.location.href='@{/smartphones}'|">Smartphones</button>
            <button type="button" th:onclick="|window.location.href='@{/cart}'|">View Shopping Cart</button>
        </nav>

        <h1>Available Books</h1>

        <!-- Message sent by the controller when a book cannot be deleted -->
        <p th:if="${error}" th:text="${error}" style="color: red;"></p>

        <!-- Only admins see this button -->
        <p sec:authorize="hasRole('ADMIN')">
            <button type="button" th:onclick="|window.location.href='@{/books/add}'|">Add new book</button>
        </p>

        <!-- Books Table (rendered only if the books list is not empty) -->
        <table border="1" th:if="${books != null and not #lists.isEmpty(books)}">
            <thead>
            <tr>
                <th>ID</th>
                <th>Title</th>
                <th>Author</th>
                <th>Price</th>
                <th>Copies</th>
                <th>Action</th>
            </tr>
            </thead>
            <tbody>
            <!-- Iterate over the books collection provided by the Controller -->
            <tr th:each="book : ${books}" th:if="${book != null}">
                <td th:text="${book.id}"></td>
                <td th:text="${book.getTitle()}"></td>
                <td th:text="${book.author}"></td>
                <td th:text="${book.price}"></td>
                <td th:text="${book.copies}"></td>
                <td>
                    <form th:action="@{/cart/add}" method="post" style="display: inline;">
                        <input type="hidden" name="productId" th:value="${book.id}"/>
                        <button type="submit">Add to Cart</button>
                    </form>

                    <!-- Edit and Delete are only visible for admins -->
                    <span sec:authorize="hasRole('ADMIN')">

                        <!-- A GET form with a button, so Edit looks the same as the other buttons -->
                        <form th:action="@{/books/edit/{id}(id=${book.id})}" method="get" style="display: inline;">
                            <button type="submit">Edit</button>
                        </form>

                        <!-- Delete must be a POST form, never a plain link -->
                        <form th:action="@{/books/delete/{id}(id=${book.id})}" method="post" style="display: inline;"
                              onsubmit="return confirm('Delete this book?');">
                            <button type="submit">Delete</button>
                        </form>
                    </span>
                </td>
            </tr>
            </tbody>
        </table>

        <!-- Fallback message displayed if no books are available -->
        <div th:if="${books == null or #lists.isEmpty(books)}">
            <p>No books available at the moment.</p>
        </div>

    </body>
</html>
